[defaults]
inventory = inventories/dev/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
forks = 20
stdout_callback = yaml
callbacks_enabled = profile_tasks, timer
interpreter_python = auto_silent
display_skipped_hosts = False
# Facts are cached on disk so that a full `site.yml` run does not re-gather
# them for every play, and so that ad-hoc checks can reuse fresh facts.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 7200

[inventory]
enable_plugins = yaml, ini, constructed
# Fail loudly instead of silently continuing with an empty host list.
unparsed_is_failed = True

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
