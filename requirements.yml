---
# Collections are pinned to a minimum version rather than an exact one: the
# roles only rely on long-stable module arguments, and floating within a major
# version keeps security fixes flowing in without a manual bump every month.
collections:
  - name: ansible.posix
    version: ">=1.5.4,<3.0.0"
  - name: community.general
    version: ">=8.0.0,<12.0.0"
  - name: community.docker
    version: ">=3.4.0,<5.0.0"

roles: []
