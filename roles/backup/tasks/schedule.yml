---
- name: Install the backup wrapper script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: "{{ backup_wrapper_path }}"
    owner: root
    group: root
    mode: "0750"
    validate: /bin/bash -n %s

- name: Create the log file with restrictive permissions
  ansible.builtin.copy:
    content: ""
    dest: "{{ backup_log_file }}"
    owner: root
    group: root
    mode: "0640"
    force: false

- name: Install the backup unit and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ backup_service_name }}.service"
    - "{{ backup_service_name }}.timer"
  notify: Reload systemd units

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: "{{ backup_service_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
