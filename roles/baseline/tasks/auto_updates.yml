---
- name: Install the unattended update tooling
  ansible.builtin.package:
    name: "{{ baseline_auto_update_packages }}"
    state: present

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: 50unattended-upgrades.j2, dest: /etc/apt/apt.conf.d/50unattended-upgrades}
    - {src: 20auto-upgrades.j2, dest: /etc/apt/apt.conf.d/20auto-upgrades}
  loop_control:
    label: "{{ item.dest }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure dnf-automatic
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Enable the update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ baseline_auto_update_services }}"
