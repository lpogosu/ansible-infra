---
baseline_sshd_package: openssh-server
baseline_sshd_service: ssh
baseline_sshd_binary: /usr/sbin/sshd
baseline_sshd_config_path: /etc/ssh/sshd_config

baseline_auditd_packages:
  - auditd
  - audispd-plugins
baseline_auditd_config_path: /etc/audit/auditd.conf

baseline_pwquality_package: libpam-pwquality
baseline_pwquality_config_path: /etc/security/pwquality.conf

baseline_auto_update_packages:
  - unattended-upgrades
  - apt-listchanges
baseline_auto_update_services:
  - apt-daily.timer
  - apt-daily-upgrade.timer

baseline_chrony_package: chrony
baseline_chrony_service: chrony
baseline_chrony_config_path: /etc/chrony/chrony.conf

# Base package set. Kept per family because the names diverge and, on RHEL, one
# of them actively conflicts — see vars/RedHat.yml.
baseline_base_packages:
  - curl
  - gnupg
  - lsof
  - rsync
  - sudo

baseline_unwanted_packages:
  - telnet
  - rsh-client
