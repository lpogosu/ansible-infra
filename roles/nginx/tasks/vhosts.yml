---
- name: Create the document roots of static virtual hosts
  ansible.builtin.file:
    path: "{{ item.root }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: "0755"
  loop: "{{ nginx_enabled_vhosts | selectattr('root', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render the enabled virtual hosts
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "{{ nginx_config_dir }}/conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_enabled_vhosts }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    vhost: "{{ item }}"
  notify:
    - Validate nginx configuration
    - Reload nginx

- name: Remove the disabled virtual hosts
  ansible.builtin.file:
    path: "{{ nginx_config_dir }}/conf.d/{{ item.name }}.conf"
    state: absent
  loop: "{{ nginx_disabled_vhosts }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Validate nginx configuration
    - Reload nginx
