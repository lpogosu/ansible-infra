---
nginx_packages:
  - nginx
nginx_user: www-data
nginx_group: www-data
nginx_service_name: nginx
nginx_config_dir: /etc/nginx
nginx_binary: /usr/sbin/nginx
nginx_pid_file: /run/nginx.pid
nginx_mime_types: /etc/nginx/mime.types
# Replacing nginx.conf wholesale would otherwise drop the module loader that
# the distribution packages of nginx-extras and friends rely on. The value is
# a glob, so an empty or missing directory is not an error.
nginx_modules_include: /etc/nginx/modules-enabled/*.conf
# Debian enables a placeholder site through this symlink farm; the role keeps
# every managed site in conf.d instead, so the farm is only cleaned up.
nginx_default_vhost_files:
  - /etc/nginx/sites-enabled/default
  - /etc/nginx/conf.d/default.conf
