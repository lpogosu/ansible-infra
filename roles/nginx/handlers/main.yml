---
# Handlers run in the order they are defined here, not in notification order,
# so the validation always precedes the reload it guards.
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: "{{ nginx_binary }} -t"
  changed_when: false

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: "{{ nginx_service_name }}"
    state: reloaded
