---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: node-exporter-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /usr/lib/systemd/systemd
    pre_build_image: true
    # systemd is PID 1 here and needs to mount and write cgroups; without this
    # the container exits before ansible ever connects and every task reports
    # UNREACHABLE, which points at the connection rather than at the container.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: node-exporter-rocky9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /usr/lib/systemd/systemd
    pre_build_image: true
    # systemd is PID 1 here and needs to mount and write cgroups; without this
    # the container exits before ansible ever connects and every task reports
    # UNREACHABLE, which points at the connection rather than at the container.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  # Scenarios live inside the role they exercise, so ansible starts from
  # roles/<name>/molecule/default and never sees the repository's ansible.cfg.
  # MOLECULE_PROJECT_DIRECTORY is the role directory; its parent is roles/.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      all:
        node_exporter_listen_address: "127.0.0.1:9100"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
