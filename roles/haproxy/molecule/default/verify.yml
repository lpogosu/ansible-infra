---
- name: Verify
  hosts: all
  # No escalation under molecule: the docker connection already lands as root.
  # Asking for sudo here fails at fact gathering, because PAM in a container
  # that is still booting answers "cannot retrieve authentication info".
  # The roles carry no task-level become, so this changes nothing they do.
  gather_facts: true
  tasks:
    - name: Ask HAProxy to parse the installed configuration
      ansible.builtin.command:
        cmd: /usr/sbin/haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      register: haproxy_verify_check

    - name: Assert that the configuration is valid
      ansible.builtin.assert:
        that:
          - "'Configuration file is valid' in haproxy_verify_check.stdout"
        fail_msg: "haproxy -c rejected the configuration: {{ haproxy_verify_check.stderr }}"

    - name: Read the rendered configuration
      ansible.builtin.slurp:
        src: /etc/haproxy/haproxy.cfg
      register: haproxy_verify_config

    - name: Assert that the frontends, backends and TLS policy were rendered
      ansible.builtin.assert:
        that:
          - haproxy_verify_rendered is search('(?m)^frontend web$')
          - haproxy_verify_rendered is search('(?m)^backend web_pool$')
          - haproxy_verify_rendered is search('(?m)^backend api_pool$')
          - haproxy_verify_rendered is search('server web1 127.0.0.1:9001 check')
          - haproxy_verify_rendered is search('server api1 127.0.0.1:9101 check maxconn 200')
          - haproxy_verify_rendered is search('balance leastconn')
          - haproxy_verify_rendered is search('http-check expect status 200')
          - haproxy_verify_rendered is search('use_backend api_pool if is_api')
          - haproxy_verify_rendered is search('ssl-min-ver TLSv1.2')
          - haproxy_verify_rendered is search('no-tls-tickets')
        fail_msg: "the rendered configuration does not match the declared topology"
      vars:
        haproxy_verify_rendered: "{{ haproxy_verify_config.content | b64decode }}"

    - name: Check that the service is running
      ansible.builtin.systemd_service:
        name: haproxy
      register: haproxy_verify_service
      check_mode: true

    - name: Stat the runtime admin socket
      ansible.builtin.stat:
        path: /run/haproxy/admin.sock
      register: haproxy_verify_socket

    - name: Assert that HAProxy is running and exposes the admin socket
      ansible.builtin.assert:
        that:
          - haproxy_verify_service.status.ActiveState == 'active'
          - haproxy_verify_socket.stat.exists
          - haproxy_verify_socket.stat.issock
        fail_msg: "HAProxy is not running or the admin socket is missing"

    - name: Request the stats page without credentials
      ansible.builtin.uri:
        url: "http://127.0.0.1:8404/haproxy-status"
        status_code:
          - 401
      register: haproxy_verify_stats_anon

    - name: Request the stats page with credentials
      ansible.builtin.uri:
        url: "http://127.0.0.1:8404/haproxy-status"
        url_username: molecule
        url_password: molecule
        force_basic_auth: true
        return_content: true
        status_code:
          - 200
      register: haproxy_verify_stats_auth

    - name: Assert that the stats page is protected and lists the backends
      ansible.builtin.assert:
        that:
          - haproxy_verify_stats_anon.status == 401
          - "'web_pool' in haproxy_verify_stats_auth.content"
          - "'api_pool' in haproxy_verify_stats_auth.content"
        fail_msg: "the stats listener is either unprotected or does not show the backends"

    - name: Scrape the built-in Prometheus exporter
      ansible.builtin.uri:
        url: "http://127.0.0.1:8404/metrics"
        return_content: true
        status_code:
          - 200
      register: haproxy_verify_metrics

    - name: Assert that the exporter emits backend metrics
      ansible.builtin.assert:
        that:
          # HAProxy's built-in exporter has no `haproxy_backend_up` — that name
          # belongs to the separate community haproxy_exporter. The state gauge
          # here is `haproxy_backend_status`.
          - "'haproxy_backend_status' in haproxy_verify_metrics.content"
        fail_msg: "the Prometheus exporter is not serving backend metrics"

    - name: Probe the TLS frontend with TLS 1.1, which must be refused
      ansible.builtin.command:
        cmd: openssl s_client -connect 127.0.0.1:8443 -tls1_1
        stdin: ""
      changed_when: false
      failed_when: false
      register: haproxy_verify_tls11

    - name: Probe the TLS frontend with TLS 1.2, which must be accepted
      ansible.builtin.command:
        cmd: openssl s_client -connect 127.0.0.1:8443 -tls1_2
        stdin: ""
      changed_when: false
      failed_when: false
      register: haproxy_verify_tls12

    - name: Assert that the TLS version floor is enforced on the bind
      ansible.builtin.assert:
        that:
          - haproxy_verify_tls11.rc != 0
          - haproxy_verify_tls12.rc == 0
        fail_msg: "TLS floor not enforced: tls1.1 rc={{ haproxy_verify_tls11.rc }}, tls1.2 rc={{ haproxy_verify_tls12.rc }}"
